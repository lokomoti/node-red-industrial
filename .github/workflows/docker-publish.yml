name: Docker Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: lokomoti/node-red-industrial
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Buildx is used for consistent modern Docker builds in CI.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine publish mode and tags
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            echo "push=true" >> "${GITHUB_OUTPUT}"
            {
              echo "tags<<EOF"
              echo "${IMAGE_NAME}:${tag}"
              # Release-like version tags also publish/update latest.
              if [[ "${tag}" =~ ^v[0-9]+(\.[0-9]+){0,2}([.-].*)?$ ]]; then
                echo "${IMAGE_NAME}:latest"
              fi
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          else
            # Branch pushes build for validation only (no publish).
            echo "push=false" >> "${GITHUB_OUTPUT}"
            {
              echo "tags<<EOF"
              echo "${IMAGE_NAME}:sha-${GITHUB_SHA}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Log in to Docker Hub
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and (optionally) push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
